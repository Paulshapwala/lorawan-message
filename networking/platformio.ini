[platformio]
default_envs = gateway_connect

[env]
platform = nordicnrf52 @ 11.0.0
board = promicro_nrf52840
framework = arduino
board_build.variants_dir = variants
monitor_speed = 115200

[env:promicro_nrf52840]
build_src_filter = +<hello_world.cpp>
lib_deps = adafruit/Adafruit SSD1306 @ ^2.5.13

[env:gateway_connect]
build_src_filter = +<gateway_connect.cpp>
build_flags = -DCONFIG_NFCT_PINS_AS_GPIOS
custom_device_id = custom-1
custom_end_devices =
    custom-1
    custom-2
custom_initial_rx1_delay = 5
custom_initial_rx2_data_rate = 3
lib_deps =
    jgromes/RadioLib @ 7.7.1
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit BusIO @ 1.17.4
extra_scripts = pre:scripts/gateway_credentials.py

[env:gateway_connect_custom_2]
extends = env:gateway_connect
custom_device_id = custom-2
custom_initial_rx1_delay = 1
custom_initial_rx2_data_rate = 0
